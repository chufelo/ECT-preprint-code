<svg width="680" height="420" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg">
<style>
  text { font-family: "DejaVu Sans", sans-serif; fill: #222; }
  .b { font-weight: bold; font-size: 13.5px; }
  .s { font-size: 12px; fill: #555; }
  .hdr { font-weight: bold; font-size: 15px; }
  .eq { font-weight: bold; font-size: 12px; }
  rect.cell { stroke-width: 0.9; rx: 4; }
  rect.header { stroke-width: 1.1; rx: 8; }
</style>

<rect class="header" data-role="external" x="30" y="20" width="295" height="40"/>
<text class="hdr" x="177" y="44" text-anchor="middle">Standard quantum mechanics</text>

<rect class="header" data-role="model" x="355" y="20" width="295" height="40"/>
<text class="hdr" x="502" y="44" text-anchor="middle">Euclidean Condensate Theory</text>

<line x1="340" y1="75" x2="340" y2="404" stroke="#bbb" stroke-width="0.5" stroke-dasharray="4 3"/>

<rect class="cell" data-role="external" x="30" y="75" width="295" height="48"/>
<text class="b" x="177" y="94" text-anchor="middle">Cauchy (initial-value) problem</text>
<text class="s" x="177" y="113" text-anchor="middle">&#x3C8;(x, t0) given &#x2192; evolve forward</text>

<rect class="cell" data-role="open" x="355" y="75" width="295" height="48"/>
<text class="b" x="502" y="94" text-anchor="middle">Specified BVP / ensemble</text>
<text class="s" x="502" y="113" text-anchor="middle">Existence / uniqueness / selection: Open</text>

<rect class="cell" data-role="external" x="30" y="131" width="295" height="48"/>
<text class="b" x="177" y="150" text-anchor="middle">i&#x210F; &#x2202;t&#x3C8; = H&#x3C8;</text>
<text class="s" x="177" y="169" text-anchor="middle">Schrodinger / Dirac equation</text>

<rect class="cell" data-role="model" x="355" y="131" width="295" height="48"/>
<text class="eq" x="502" y="150" text-anchor="middle">&#x3B4;^(AB) &#x2202;_A&#x2202;_B &#x3A6; &#x2212; V&#x2032;(&#x3A6;) = 0</text>
<text class="s" x="502" y="169" text-anchor="middle">Euclidean condensate equation</text>

<rect class="cell" data-role="external" x="30" y="187" width="295" height="86"/>
<text class="b" x="177" y="218" text-anchor="middle">|&#x3C8;|&#x00B2; = Born rule</text>
<text class="s" x="177" y="243" text-anchor="middle">Fundamental axiom</text>

<rect class="cell" data-role="conditional" x="355" y="187" width="295" height="86"/>
<text class="b" x="502" y="203" text-anchor="middle">Admitted-measure representation</text>
<text class="s" x="502" y="220" text-anchor="middle">dim &#x2265; 3: C1+C2 projectors;</text>
<text class="s" x="502" y="234.5" text-anchor="middle">dim 2: C1+C2q effects</text>
<text class="s" x="502" y="249" text-anchor="middle">state / event / probability /</text>
<text class="s" x="502" y="263.5" text-anchor="middle">outcome / update: Open</text>

<rect class="cell" data-role="external" x="30" y="281" width="295" height="56"/>
<text class="b" x="177" y="301" text-anchor="middle">Time: fundamental coordinate</text>
<text class="s" x="177" y="320" text-anchor="middle">Lorentzian spacetime a priori</text>

<rect class="cell" data-role="conditional" x="355" y="281" width="295" height="56"/>
<text class="b" x="502" y="300" text-anchor="middle">P4 supplies an ordered direction</text>
<text class="s" x="502" y="315" text-anchor="middle">Scalar signature needs supplied coefficients;</text>
<text class="s" x="502" y="328" text-anchor="middle">selection / physical cones: Open</text>

<rect class="cell" data-role="external" x="30" y="345" width="295" height="52"/>
<text class="b" x="177" y="365" text-anchor="middle">Measurement / update rule</text>
<text class="s" x="177" y="384" text-anchor="middle">Textbook formulations; interpretations differ</text>

<rect class="cell" data-role="open" x="355" y="345" width="295" height="52"/>
<text class="b" x="502" y="365" text-anchor="middle">Measurement / outcome map: Open</text>
<text class="s" x="502" y="384" text-anchor="middle">Decoherence alone does not select outcome</text>
</svg>
