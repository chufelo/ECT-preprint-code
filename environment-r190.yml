name: ect-preprint-r190
channels:
  - conda-forge
dependencies:
  - python=3.13.5
  - numpy=2.3.0
  - scipy=1.17.1
  - matplotlib=3.10.9
  - sympy=1.14.0
  - pillow=12.2.0
  - pymupdf=1.28.0
  - pypdf=6.14.2
  - pyyaml=6.0.3
  - graphviz=14.1.3

# This environment describes the R190 Python/Graphviz publication utilities.
# It is an executable environment specification, not a platform lockfile.
# Exact runtime versions belong in a runtime sidecar and do not change the
# scientific artifact digest. TeX, BibTeX, fonts, locale, and any
# SOURCE_DATE_EPOCH are recorded separately by the final build reports.
